# ============================================================================
# dsh-pet 的 bundle patch —— 把宠物插件挂进 DSH 配置树
# ============================================================================
#
# 【这是什么】
#   这是 dsh-pet 的"挂载声明"。DSH 启动时按 bundle 层栈把各个插件的
#   patch 叠起来组成配置树。本文件就是 dsh-pet 这一层的内容。
#
# 【工作原理】
#   - insert：往配置树里添加新的插件行（entry）
#   - 每个 entry 有 id（行标识，patch 覆盖时按它定位）和 name（插件模块）
#   - id 必须全局唯一且与包名一致：DSH STORE 上架契约按它比对 entryIds，
#     裸名（如 pet）会与其它插件的行标识冲突，候选会被判为缺少 entry ID
#   - 插件行那一行（"id: 值"）绝不能写行尾注释：商城预检（check-plugin-submission.mjs）
#     用正则抓该行的值并要求其后直接换行，行尾注释会让它抓不到 entry ID，
#     整份提交被判 SUBMISSION_ENTRY_MISSING（与 id 叫什么名字无关）
#   - name: 'dsh-pet' 会解析包入口 lib/index.js（宿主半侧）
#   - 因为 package.json 声明了 dsh.client，DSH 的模块系统同时会把
#     这个包扫描为"浏览器插件"，提供 /plugins/dsh-pet/client.js 给页面
#
# ============================================================================

- insert:
    - id: dsh-pet
      name: 'dsh-pet'             # 模块名：解析到 lib/index.js
    # ---------------------------------------------------------------------
    # 桌宠预设（fork 定制）：把桌宠装成 DSH「新对话」里的一个人格。
    #
    # 为什么放在这里而不是改 DSH 本体：预设是插件能声明的扩展点
    # （@deepseek-ai/dsh-agent-preset 的 Config 就是「id/name/order/plugins」四件事），
    # 声明出来的预设会自动出现在新对话选择器里，不需要动 app.asar。
    #
    # 只读：tool-fs 打开 read/readImage、关掉 write/edit —— 桌宠会话能看工作区，
    # 但改不了任何文件；dsh-pet/preset 再补一段【说明】把这件事讲给模型听。
    # 记忆：plugins 里的 dsh-pet/preset 注册 deployment:persona-prefix 段（每次装配现算），
    # 所以 /remember 记下的事实下一条消息就生效，不用重开会话。
    # ---------------------------------------------------------------------
    - id: preset-pet
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: pet
        name: 桌宠
        description: 陪聊用的桌宠会话：人格是桌面上那只小家伙，工具只读，看得到工作区但改不了文件。
        order: 900
        plugins:
          - id: pet-persona
            name: 'dsh-pet/preset'
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              # 必填（z.boolean().required()）：漏了会让整个「桌宠」预设加载失败
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
